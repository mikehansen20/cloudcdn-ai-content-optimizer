[package]
name    = "aico-edge-plugin"
version = "0.1.0"
edition = "2021"
publish = false

# Proxy-Wasm module → compiled to wasm32-wasip1 and shipped as a GCP Service Extensions
# plugin. Detection only: UA match → rewrite :path; no source-IP logic.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# proxy-wasm host bindings are wasm-only, so native `cargo test` (the pure decision
# logic) compiles without it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
proxy-wasm = "0.2"

[profile.release]
opt-level = "s"   # small wasm
lto       = true
strip     = true
